version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: whatsapp-api-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - whatsapp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: whatsapp-api-backend
    restart: always
    depends_on:
      - mongodb
    ports:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_PATH=/app/sessions
      - MONGODB_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin
    volumes:
      - whatsapp-sessions:/app/sessions
    networks:
      - whatsapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: whatsapp-api-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80"
    networks:
      - whatsapp-network

networks:
  whatsapp-network:
    driver: bridge

volumes:
  mongo-data:
  whatsapp-sessions: